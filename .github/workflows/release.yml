name: Release

# Pushing a version tag (e.g. 1.0.0.0) builds the plugin and publishes a GitHub release with latest.zip,
# which is what pluginmaster.json points to.
on:
  push:
    tags:
      - '*.*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Check that the tag matches the project version
      run: |
        $version = ([xml](Get-Content DpsInServerBar/DpsInServerBar.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        if ($version -ne $env:GITHUB_REF_NAME) {
          Write-Error "Tag $env:GITHUB_REF_NAME does not match the project version $version"
          exit 1
        }

    - name: Extract the release notes from CHANGELOG.md
      run: |
        $lines = Get-Content CHANGELOG.md
        $header = $lines | Select-String -Pattern "^## $([regex]::Escape($env:GITHUB_REF_NAME))\s*$" | Select-Object -First 1
        if (-not $header) {
          Write-Error "CHANGELOG.md has no '## $env:GITHUB_REF_NAME' section"
          exit 1
        }

        # LineNumber is 1-based: it is also the index of the first line after the header.
        $notes = @()
        for ($i = $header.LineNumber; $i -lt $lines.Count -and $lines[$i] -notmatch '^## '; $i++) {
          $notes += $lines[$i]
        }

        $body = ($notes -join "`n").Trim() + "`n`n---`n`nInstall from Dalamud with the custom repository:`n" +
                "``https://raw.githubusercontent.com/FunkyJumbo/DPS-In-Server-Bar/master/pluginmaster.json```n"
        Set-Content -Path release-notes.md -Value $body -Encoding utf8

    - name: Build
      run: dotnet build --configuration Release

    - name: Publish the release
      uses: softprops/action-gh-release@v2
      with:
        name: DPS In Server Bar ${{ github.ref_name }}
        body_path: release-notes.md
        files: DpsInServerBar/bin/Release/DpsInServerBar/latest.zip
        fail_on_unmatched_files: true
